// ZFileManager file picker, vendored as source (replaces the source-less app/libs/z_file.aar).
// Base: https://github.com/zippo88888888/ZFileManager (Apache-2.0, Copyright zippo88888888).
// Modified by the ZeroTermux author (hanxinhao000) under GPL-3.0; taken from the z_file/ module of
// https://github.com/msmt2017/new_ZeroTermux at commit f68fd87. See THIRD_PARTY_NOTICES.md and z_file/NOTICE.md.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.zp.z_file'
    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures {
        viewBinding true
        buildConfig false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'commons-io:commons-io:2.5'
    implementation 'com.google.code.gson:gson:2.8.6'
    // p7zip JNI wrapper, pinned (was '+', which resolved to 1.7.1)
    api 'com.hzy:un7zip:1.7.1'
}
