name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy 'tools' package, which
          # current sdkmanager no longer offers ("Failed to find package 'tools'").
          packages: 'platform-tools'

      - name: Install required SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :terminal-emulator:testDebugUnitTest --continue --stacktrace

      # Gradle exiting 0 is not proof tests ran (a filtered or crashed run can leave zero or truncated
      # results). Require parseable result files, no failures/errors, and a minimum test count.
      - name: Verify unit test results (reject zero/incomplete/failed runs)
        run: |
          python3 scripts/ci/verify_test_results.py app/build/test-results/testDebugUnitTest --min-tests 250
          python3 scripts/ci/verify_test_results.py terminal-emulator/build/test-results/testDebugUnitTest --min-tests 137

      - name: Run AI helper script regressions
        run: |
          python3 -m unittest discover -s tests/ai-agents -p 'test_*.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_*.py' -v
          bash tests/ai-agents/test_vsphone_gate.sh

      - name: Verify debug APK matches source (id, version, targetSdk, native libs)
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "== $apk"
            case "$apk" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*) abi=x86_64 ;;
              *x86*) abi=x86 ;;
              *) abi="" ;;
            esac
            scripts/ci/verify_apk.sh "$apk" "$abi"
          done
          python3 tests/ci/check_apk_helper.py app/build/outputs/apk/debug/*.apk

      - name: Upload unit test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VictorSuite-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            terminal-emulator/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Upload debug APKs
        # The APK build above is the check. A full Actions storage quota on the
        # account should not turn a successful build red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VictorSuite-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    # Signed release build. Runs on pushes to main and on manual dispatch only, so PR
    # debug checks stay unchanged. `needs: build` makes a signed release impossible unless the
    # build + unit-test + verification job above passed for this same commit (both jobs check out
    # github.sha). Signing material comes ONLY from repo secrets:
    #   SIGNING_KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD
    # If the secrets are not configured the job skips the build instead of failing.
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and GitHub Release below
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' && secrets.STORE_PASSWORD != '' }}

    steps:
      - name: Report missing signing secrets
        if: env.HAS_SIGNING_SECRETS != 'true'
        run: echo "::warning::Release signing secrets are not configured; skipping signed release build."

      - name: Checkout
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required SDK components
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Decode release keystore
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          # Fetch bootstrap zips first: the release ndkBuild can run before javaCompile,
          # which is what triggers downloadBootstraps.
          ./gradlew :app:downloadBootstraps
          ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release APKs and write SHA256SUMS
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          cd app/build/outputs/apk/release
          shopt -s nullglob
          apks=(*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "::error::no release APKs"; exit 1; }
          cd - >/dev/null
          for apk in app/build/outputs/apk/release/*.apk; do
            case "$apk" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*) abi=x86_64 ;;
              *x86*) abi=x86 ;;
              *) abi="" ;;
            esac
            scripts/ci/verify_apk.sh "$apk" "$abi" | tee -a "$RUNNER_TEMP/apk-verify.txt"
            # A release APK must carry a verifiable signature.
            "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify "$apk"
          done
          (cd app/build/outputs/apk/release && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)

      - name: Remove decoded keystore
        if: always() && env.HAS_SIGNING_SECRETS == 'true'
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload release APKs
        if: env.HAS_SIGNING_SECRETS == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VictorSuite-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
          retention-days: 14

      # Publishes a pre-release for the versionName in app/build.gradle. Pushes to main only,
      # so manual runs and other branches never publish. Skips if the tag already exists, so
      # re-running a build for the same version does not touch an existing release.
      - name: Publish GitHub Release
        id: publish
        if: env.HAS_SIGNING_SECRETS == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP '^\s*versionName "\K[^"]+' app/build.gradle | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from app/build.gradle"
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/SHA256SUMS)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No release APKs found to attach"
            exit 1
          fi
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "Built and signed by CI from commit $GITHUB_SHA after unit tests and APK checks passed for that commit. Not device-tested; see docs/STABILITY_RELEASE_REPORT.md for what is and is not runtime-verified."
            echo
            echo "Prefer the ABI-specific APK for your device; use universal only if needed."
            echo
            echo "## Changes${PREV:+ since $PREV}"
            git log --no-merges --max-count=50 --pretty='- %s' ${PREV:+"$PREV"..}HEAD
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "${APKS[@]}" \
            --target "$GITHUB_SHA" \
            --title "VictorSuite $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Release retention policy: keep only the release just published. Every other
      # release (and any older draft) is deleted. Git tags are KEPT (no --cleanup-tag)
      # so every published build stays traceable to its source for GPL compliance.
      # Runs only when the step above actually created a release.
      - name: Prune outdated GitHub Releases
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          # Confirm the new release exists before deleting anything.
          gh release view "$KEEP_TAG" >/dev/null
          # All releases incl. drafts, newest first by created date.
          mapfile -t TAGS < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.created_at, .tag_name] | @tsv' | sort -r | cut -f2)
          NEWEST="${TAGS[0]:-}"
          if [ "$NEWEST" != "$KEEP_TAG" ]; then
            echo "::warning::Newest release ($NEWEST) is not the one just published ($KEEP_TAG); skipping prune."
            exit 0
          fi
          for t in "${TAGS[@]:1}"; do
            [ -z "$t" ] || [ "$t" = "$KEEP_TAG" ] && continue
            echo "Deleting outdated release $t (tag kept)"
            gh release delete "$t" --yes
          done
