name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy 'tools' package, which
          # current sdkmanager no longer offers ("Failed to find package 'tools'").
          packages: 'platform-tools'

      - name: Install required SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VictorSuite-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Upload debug APKs
        # The APK build above is the check. A full Actions storage quota on the
        # account should not turn a successful build red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VictorSuite-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    # Signed release build. Runs on pushes to main and on manual dispatch only, so PR
    # debug checks stay unchanged. Signing material comes ONLY from repo secrets:
    #   SIGNING_KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD
    # If the secrets are not configured the job skips the build instead of failing.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and GitHub Release below
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' && secrets.STORE_PASSWORD != '' }}

    steps:
      - name: Report missing signing secrets
        if: env.HAS_SIGNING_SECRETS != 'true'
        run: echo "::warning::Release signing secrets are not configured; skipping signed release build."

      - name: Checkout
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required SDK components
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Decode release keystore
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          # Fetch bootstrap zips first: the release ndkBuild can run before javaCompile,
          # which is what triggers downloadBootstraps.
          ./gradlew :app:downloadBootstraps
          ./gradlew :app:assembleRelease --stacktrace

      - name: Remove decoded keystore
        if: always() && env.HAS_SIGNING_SECRETS == 'true'
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload release APKs
        if: env.HAS_SIGNING_SECRETS == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VictorSuite-release-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # Publishes a pre-release for the versionName in app/build.gradle. Pushes to main only,
      # so manual runs and other branches never publish. Skips if the tag already exists, so
      # re-running a build for the same version does not touch an existing release.
      - name: Publish GitHub Release
        if: env.HAS_SIGNING_SECRETS == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP '^\s*versionName "\K[^"]+' app/build.gradle | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from app/build.gradle"
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No release APKs found to attach"
            exit 1
          fi
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "Built and signed by CI from commit $GITHUB_SHA. Not device-tested."
            echo
            echo "Prefer the ABI-specific APK for your device; use universal only if needed."
            echo
            echo "## Changes${PREV:+ since $PREV}"
            git log --no-merges --max-count=50 --pretty='- %s' ${PREV:+"$PREV"..}HEAD
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "${APKS[@]}" \
            --target "$GITHUB_SHA" \
            --title "VictorSuite $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
