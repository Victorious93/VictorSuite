    // VictorSuite modify {@
    // Release signing comes ONLY from the environment (CI secrets). Nothing secret is
    // committed. Required env vars:
    //   SIGNING_KEYSTORE_FILE   path to the release keystore, OR
    //   SIGNING_KEYSTORE_BASE64 base64 of the keystore (decoded into app/build/)
    //   KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD
    // If any is missing, release builds are left UNSIGNED (a warning is printed).
    // Debug builds use the standard Android debug keystore (~/.android/debug.keystore).
    def releaseKeystore = null
    def keystorePathEnv = System.getenv("SIGNING_KEYSTORE_FILE")
    def keystoreB64Env = System.getenv("SIGNING_KEYSTORE_BASE64")
    if (keystorePathEnv) {
        releaseKeystore = file(keystorePathEnv)
        if (!releaseKeystore.isFile()) {
            throw new GradleException("SIGNING_KEYSTORE_FILE points to a missing file: " + keystorePathEnv)
        }
    } else if (keystoreB64Env) {
        releaseKeystore = new File(buildDir, "signing/release.jks")
        releaseKeystore.parentFile.mkdirs()
        releaseKeystore.bytes = Base64.mimeDecoder.decode(keystoreB64Env.trim())
    }
    def releaseSigningReady = releaseKeystore != null &&
            System.getenv("KEY_ALIAS") && System.getenv("KEY_PASSWORD") && System.getenv("STORE_PASSWORD")

    signingConfigs {
        debug {
            // Dedicated, committed VictorSuite debug key (NOT a secret).
            // Keeps the debug fingerprint stable across machines/CI so
            // debug builds install over each other.
            storeFile file('victorsuite-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningReady) {
            release {
                storeFile releaseKeystore
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
                storePassword System.getenv("STORE_PASSWORD")
            }
        }
    }
    if (!releaseSigningReady) {
        logger.warn("VictorSuite: release signing env vars not set " +
                "(SIGNING_KEYSTORE_FILE|SIGNING_KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD); " +
                "release APKs will be unsigned.")
    }
    // @}


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
